name: Free Books Security & Link Verify

on:
  schedule:
    - cron: "17 5 * * 0" # Weekly Sunday 05:17 UTC
  workflow_dispatch:
    inputs:
      dry_run:
        description: Run verification without writing manifest changes
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: free-books-verify-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Every action is pinned to a full commit SHA (Renovate updates SHA + comment together).
      - name: Checkout reviewed default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc

      - name: Setup Bun
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"

      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts

      - name: Run DNSBL + SSRF-safe reachability & parking sweep
        env:
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          NEXT_TELEMETRY_DISABLED: "1"
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$DRY_RUN" == "true" ]]; then
            bun --conditions=react-server run scripts/books/verify-free-books.ts --dry-run
          else
            bun --conditions=react-server run scripts/books/verify-free-books.ts --write
          fi
