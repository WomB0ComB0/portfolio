name: Scheduled link health

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check due links without saving results
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: link-health-production
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout reviewed default branch
        uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: "26"
      - name: Setup Bun for frozen installation
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.4.5"
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check due published links
        env:
          SANITY_LINK_HEALTH_TOKEN: ${{ secrets.SANITY_LINK_HEALTH_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          NEXT_TELEMETRY_DISABLED: "1"
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          node --conditions=react-server --import=tsx scripts/link-health/check.ts "${args[@]}"
