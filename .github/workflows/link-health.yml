name: Scheduled link health

on:
  schedule:
    - cron: "23 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: Check due links without saving results
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: link-health-production
  cancel-in-progress: false

jobs:
  check:
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # This job holds a Sanity write token, so every action is pinned to a full commit SHA
      # (the release tag is in the comment); Renovate updates the SHA and the comment together.
      - name: Checkout reviewed default branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Same Node major as .nvmrc, package.json engines (which Vercel follows) and the build workflow.
      - name: Setup Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Setup Bun for frozen installation
        uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: "1.4.5"
      - name: Install dependencies without lifecycle scripts
        run: bun install --frozen-lockfile --ignore-scripts
      - name: Check due published links
        env:
          SANITY_LINK_HEALTH_TOKEN: ${{ secrets.SANITY_LINK_HEALTH_TOKEN }}
          NEXT_PUBLIC_SANITY_PROJECT_ID: ${{ secrets.NEXT_PUBLIC_SANITY_PROJECT_ID }}
          NEXT_PUBLIC_SANITY_DATASET: production
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || false }}
          NEXT_TELEMETRY_DISABLED: "1"
        shell: bash
        run: |
          set -euo pipefail
          args=()
          if [[ "$DRY_RUN" == "true" ]]; then args+=(--dry-run); fi
          node --conditions=react-server --import=tsx scripts/link-health/check.ts "${args[@]}"
